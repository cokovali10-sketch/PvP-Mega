name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the resource pack metadata
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const meta = JSON.parse(fs.readFileSync("pack.mcmeta", "utf8"));
            const p = meta.pack || {};
            const hasFormat =
              typeof p.pack_format === "number" ||
              typeof p.min_format === "number" ||
              typeof p.max_format === "number";
            if (!hasFormat) {
              console.error("pack.mcmeta is missing pack.pack_format / min_format / max_format");
              process.exit(1);
            }
            let files = 0;
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else files++;
              }
            };
            walk("assets");
            console.log("pack metadata ok, " + files + " asset files");
          '